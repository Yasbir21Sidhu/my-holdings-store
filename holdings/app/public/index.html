<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holdings • Strategy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-5xl font-bold text-orange-500 mb-2">Holdings</h1>
    <p class="text-zinc-400 mb-10">Personal Bitcoin Strategy Dashboard</p>

    <!-- Input Screen -->
    <div id="input-screen" class="max-w-lg mx-auto bg-zinc-900 rounded-3xl p-10">
      <h2 class="text-2xl mb-8">Enter your xpub</h2>
      <input id="xpub" type="text" placeholder="xpub..." class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 text-sm mb-4">
      <input id="label" type="text" value="My Holdings" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 text-sm mb-8">
      <button onclick="loadHoldings()" class="w-full bg-orange-500 hover:bg-orange-600 transition py-5 rounded-2xl font-semibold text-lg">
        Load My Holdings
      </button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <!-- Content injected by JavaScript -->
    </div>
  </div>

  <script>
    async function loadHoldings() {
      const xpub = document.getElementById('xpub').value.trim();
      if (!xpub) return alert("Please enter your xpub");

      const res = await fetch('/api/load', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ xpub, label: document.getElementById('label').value })
      });

      const data = await res.json();
      if (data.error) return alert(data.error);

      renderDashboard(data);
    }

    function renderDashboard(data) {
      document.getElementById('input-screen').classList.add('hidden');
      const dash = document.getElementById('dashboard');
      dash.classList.remove('hidden');

      dash.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
          <div class="bg-zinc-900 p-6 rounded-3xl">
            <p class="text-sm text-zinc-400">Total Bitcoin</p>
            <p class="text-4xl font-bold mt-2">${data.totalBtc}</p>
          </div>
          <div class="bg-zinc-900 p-6 rounded-3xl">
            <p class="text-sm text-zinc-400">Current Value</p>
            <p class="text-4xl font-bold mt-2">$${data.totalValue.toLocaleString()}</p>
          </div>
          <div class="bg-zinc-900 p-6 rounded-3xl">
            <p class="text-sm text-zinc-400">Unrealized P&L</p>
            <p class="text-4xl font-bold mt-2 ${data.totalPnl >= 0 ? 'text-green-500' : 'text-red-500'}">
              ${data.totalPnl >= 0 ? '+' : ''}$${Math.abs(data.totalPnl).toLocaleString()} (${data.totalPnlPct}%)
            </p>
          </div>
          <div class="bg-zinc-900 p-6 rounded-3xl">
            <p class="text-sm text-zinc-400">Current BTC Price</p>
            <p class="text-4xl font-bold mt-2">$${data.currentPrice.toLocaleString()}</p>
          </div>
        </div>

        <div class="bg-zinc-900 p-8 rounded-3xl mb-10">
          <canvas id="priceChart" height="110"></canvas>
        </div>

        <div class="bg-zinc-900 rounded-3xl overflow-hidden">
          <table class="w-full">
            <thead class="bg-zinc-800">
              <tr>
                <th class="text-left p-6">Date</th>
                <th class="text-right p-6">BTC</th>
                <th class="text-right p-6">Price Then</th>
                <th class="text-right p-6">Value Now</th>
                <th class="text-right p-6">P&L</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      `;

      // Chart with Orange Dots
      const ctx = document.getElementById('priceChart');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.utxos.map(u => u.date),
          datasets: [{
            label: 'BTC Price',
            data: data.utxos.map(u => u.priceThen),
            borderColor: '#eab308',
            tension: 0.3,
            pointRadius: 6,
            pointBackgroundColor: '#f97316',
            pointBorderColor: '#fff'
          }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#27272a' } } } }
      });

      // Fill Table
      const tbody = document.getElementById('table-body');
      data.utxos.forEach(u => {
        tbody.innerHTML += `
          <tr class="hover:bg-zinc-800/50">
            <td class="p-6">${u.date}</td>
            <td class="p-6 text-right font-medium">${u.amount}</td>
            <td class="p-6 text-right">$${u.priceThen.toLocaleString()}</td>
            <td class="p-6 text-right">$${u.valueNow.toLocaleString()}</td>
            <td class="p-6 text-right ${u.pnl >= 0 ? 'text-green-500' : 'text-red-500'}">
              ${u.pnl >= 0 ? '+' : ''}$${Math.abs(u.pnl).toLocaleString()} (${u.pnlPct}%)
            </td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
